name = "legalease-pakistan"
compatibility_date = "2026-10-01"
pages_build_output_dir = "./public"

# Replace database_id with your actual D1 database ID from Cloudflare.
[[d1_databases]]
binding = "DB"
database_name = "legalease-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
AI_MODEL = "gemini-2.5-flash"
# Set via: npx wrangler pages secret put GEMINI_API_KEY --project-name legalease-pakistan
# Never commit GEMINI_API_KEY to GitHub.
